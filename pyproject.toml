[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alert-router"
version = "0.1.0"
description = "Webhook service that normalizes, deduplicates, enriches and routes monitoring alerts."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Armando Gomez"}]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["alertrouter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
